[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qrtc-transit"
version = "0.1.0"
description = "Formal kernel for QRTC Transit analysis"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"hypothesis>=6.112",
	"mypy>=1.11",
	"ruff>=0.6",
	"build>=1.2",
	"pip-audit>=2.7",
]

[project.scripts]
qrtc = "qrtc.cli:main"
qrtc-demo = "qrtc.telemetry_demo:main"
carla-live-drive = "qrtc.carla_harness:main"
qrtc-benchmark-phase1 = "qrtc_benchmark.run_phase1:main"
qrtc-benchmark-phase2 = "qrtc_benchmark.run_phase2:main"
qrtc-benchmark-phase2-sweep = "qrtc_benchmark.run_phase2_sweep:main"
qrtc-benchmark-phase3 = "qrtc_benchmark.run_phase3:main"
qrtc-benchmark-phase4 = "qrtc_benchmark.run_phase4:main"
qrtc-benchmark-phase5 = "qrtc_benchmark.run_phase5:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: mark test as requiring a live CARLA simulator (excluded by default; pass --live to run)",
]

[tool.setuptools.packages.find]
where = ["src"]
