[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qrtc-transit"
version = "0.1.0"
description = "Formal kernel for QRTC Transit analysis"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"hypothesis>=6.112",
	"mypy>=1.11",
	"ruff>=0.6",
	"build>=1.2",
	"pip-audit>=2.7",
]

[project.scripts]
qrtc = "qrtc.cli:main"
qrtc-demo = "qrtc.telemetry_demo:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
