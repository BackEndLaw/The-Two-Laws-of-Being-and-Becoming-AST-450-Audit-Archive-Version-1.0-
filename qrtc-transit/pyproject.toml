[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qrtc-transit"
version = "0.1.0"
description = "Formal kernel for QRTC Transit analysis"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"hypothesis>=6.112",
	"mypy>=1.11",
	"ruff>=0.6",
	"build>=1.2",
	"pip-audit>=2.7",
]
carla-live = [
	"carla>=0.9.13; platform_system == 'Linux'",
]

[project.scripts]
qrtc = "qrtc.cli:main"
qrtc-demo = "qrtc.telemetry_demo:main"
qrtc-benchmark-phase5 = "qrtc_benchmark.run_phase5:main"
qrtc-carla-smoke = "qrtc.carla_live_cli:main"
qrtc-carla-driving = "qrtc.carla_driving_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not carla'"
markers = [
	"carla: opt-in live CARLA simulator integration tests",
	"integration: integration tests that may require external services",
]

[tool.setuptools.packages.find]
where = ["src"]
